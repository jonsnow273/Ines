# =============================================================
# Ines - Automation Whitelist
# Controls which PC actions Ines is allowed to execute.
# Each category can be enabled/disabled independently.
# Actions not in the "allowed" list are blocked by default.
# =============================================================

file_operations:
  enabled: true
  allowed:
    - open
    - read
    - list
    - search
    - create_file
    - create_folder
    - copy_file
    - rename
  blocked:
    - delete
    - format
    - overwrite

application_control:
  enabled: true
  allowed:
    - open_app
    - close_app
    - switch_app
    - open_in_vscode
  blocked:
    - install
    - uninstall

system_commands:
  enabled: false
  allowed: []
  blocked:
    - shutdown
    - restart
    - registry_edit
    - disk_format

web_actions:
  enabled: true
  allowed:
    - open_url
    - search_web
  blocked:
    - download_file
    - execute_script

# Actions that ALWAYS require explicit user confirmation
destructive_actions:
  - delete
  - overwrite
  - move
  - rename
  - close_app
  - uninstall
  - kill_process
